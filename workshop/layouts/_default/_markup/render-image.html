{{- $url := .Destination -}}
{{- if and (hasPrefix $url "/") (not (hasPrefix $url "//")) -}}
  {{- $url = strings.TrimPrefix "/" $url | relURL -}}
{{- end -}}
<figure><a href="{{ $url | safeURL }}"><img src="{{ $url | safeURL }}" alt="{{ .Text }}" loading="lazy"></a>{{ with .Title }}<figcaption class="diagram-caption">{{ . }}</figcaption>{{ end }}</figure>
