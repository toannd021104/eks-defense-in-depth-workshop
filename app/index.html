<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>EKS Notes Lab</title>
<style>body{font:17px system-ui;max-width:760px;margin:7vh auto;padding:24px;color:#172c43;background:#f4f7fb}h1{font-size:42px}input,button{font:inherit;padding:12px;border:1px solid #abbccd;border-radius:5px}input{width:65%}button{background:#173c64;color:white;cursor:pointer}li{padding:10px}pre{white-space:pre-wrap;background:white;padding:20px}small{color:#48657d}</style>
<small>DEFENSE IN DEPTH · AMAZON EKS</small><h1>Một request, nhiều lớp bảo vệ.</h1><p>ALB → Nginx → API → RDS. Báo cáo được xử lý qua SQS và worker.</p>
<form id="form"><input id="body" maxlength="1000" placeholder="Nội dung ghi chú" required><button>Lưu</button></form><ul id="notes"></ul>
<button id="report">Tạo báo cáo nền</button><pre id="result">Đang tải…</pre>
<script>const result=document.querySelector('#result');async function call(p,opt){const r=await fetch('/api/'+p,opt);const d=await r.json();if(!r.ok)throw Error(JSON.stringify(d));return d}async function load(){const rows=await call('notes');const ul=document.querySelector('#notes');ul.replaceChildren();for(const row of rows){const li=document.createElement('li');li.textContent=row.body;ul.append(li)}result.textContent=JSON.stringify(await call('reports'),null,2)}document.querySelector('#form').onsubmit=async e=>{e.preventDefault();try{await call('notes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({body:document.querySelector('#body').value})});e.target.reset();await load()}catch(e){result.textContent=e.message}};document.querySelector('#report').onclick=async()=>{try{result.textContent=JSON.stringify(await call('reports',{method:'POST'}));setTimeout(()=>load().catch(e=>result.textContent=e.message),3000)}catch(e){result.textContent=e.message}};load().catch(e=>result.textContent=e.message)</script></html>
